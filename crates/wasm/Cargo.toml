[package]
name = "oxjvm-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly entry points for the oxjvm runtime (no_std; threads optional)"

[dependencies]
oxjvm-classfile = { path = "../classfile" }
oxjvm-platform = { path = "../platform", default-features = false }
oxjvm-vm = { path = "../vm", default-features = false }
oxjvm-java = { path = "../java", default-features = false }

[lints]
workspace = true

[features]
default = []
# Build a `cdylib` for wasm32-unknown-unknown with the C ABI exports.
export = []
# Run the VM on a spawned thread when the wasm engine has shared-memory threads.
threads = ["oxjvm-platform/threads"]
