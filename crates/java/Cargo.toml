[package]
name = "oxjvm-java"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The native java.* class library for the oxjvm runtime"

[dependencies]
oxjvm-classfile = { path = "../classfile" }
oxjvm-platform = { path = "../platform", default-features = false }
oxjvm-vm = { path = "../vm", default-features = false }

[lints]
workspace = true

[features]
default = []
std = ["oxjvm-vm/std"]
