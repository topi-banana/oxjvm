# Configuration for `typos` (https://github.com/crate-ci/typos).

[files]
# Auto-generated IANA Language Subtag Registry equivalent maps: the keys/values are
# standard language/region subtags, not English words.
extend-exclude = ["crates/java/src/locale_match.rs", "crates/java/src/locale_iso.rs"]

[default.extend-words]
# `ifle` is the JVM bytecode opcode "if less than or equal" (JVMS §6): it appears in the opcode
# table, in the disassembler, and in the vendored `javac` fixture sources; not a misspelling of
# "file".
ifle = "ifle"
Ifle = "Ifle"
# `mis` is the prefix in pinned prose ("mis-handles", "mis-read"); not a misspelling of
# "miss"/"mist".
mis = "mis"
# `IZ` is the JVM descriptor for a `(int, boolean)` parameter list (JVMS §4.3.3), e.g. in
# `(IZ)V`; not a misspelling of "is".
IZ = "IZ"
# `writeable`/`Writeable` are the spellings used by JDK API (`com.sun.management.VMOption` has
# `isWriteable()` and a `writeable` field); not a misspelling of "writable".
writeable = "writeable"
Writeable = "Writeable"
# `Pn` is the ISO 8601 duration designator that starts an XSD `duration` literal (`PnYnMnDTnHnMnS`);
# not a misspelling of "on".
Pn = "Pn"
# `ECT` and `IST` are the tz database "short IDs" (`java.util.TimeZone`), mapped by the JDK to
# `Europe/Paris` and `Asia/Kolkata`; not misspellings of "etc"/"is".
ECT = "ECT"
IST = "IST"
# `EDE` is the triple-DES "encrypt-decrypt-encrypt" mode in the JDK security algorithm names
# (`3DES_EDE_CBC`, `TLS_RSA_WITH_3DES_EDE_CBC_SHA`); not a misspelling of "edge".
EDE = "EDE"
# ISO 639 language codes used by `Locale.getISO3Language`/`getISOLanguages`; these are
# standard codes, not misspellings of the English words typos suggests.
tha = "tha"
ba = "ba"
bre = "bre"
fo = "fo"
ful = "ful"
nd = "nd"
sme = "sme"
som = "som"
yor = "yor"
